# Free demonstration stack. Database initialization is opt-in and preserves existing accounts.
services:
  - type: web
    name: oncare-be
    runtime: docker
    branch: suhhee/render-demo-deploy
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DEMO_RELAXED_HOURS
        value: "true"
      - key: DEMO_SEED_ON_START
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: oncare-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: oncare-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: oncare-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: oncare-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: oncare-postgres
          property: password

databases:
  - name: oncare-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: hospital
    user: hospital
    ipAllowList: []
