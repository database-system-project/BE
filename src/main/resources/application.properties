spring.application.name=hospital-be
spring.config.import=optional:file:./.env[.properties]
spring.profiles.default=local

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:15432}/${POSTGRES_DB:hospital}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:hospital}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-numbers-for-enums=true

hospital.web.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}
hospital.security.jwt-secret=${JWT_SECRET:}
hospital.security.token-ttl-seconds=${JWT_TTL_SECONDS:1800}

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

#---
spring.config.activate.on-profile=local
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
