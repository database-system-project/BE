spring:
  config:
    import: "file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:15432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

server:
  address: 127.0.0.1

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
