spring:
  config:
    import: "file:./.env[.properties]"
  datasource:
    url: jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:15432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

server:
  address: 127.0.0.1

hospital:
  web:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
