# Render provides PORT; DB credentials are injected by the Blueprint.
server.address=0.0.0.0
server.port=${PORT:10000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

# Keep API documentation disabled outside the local profile.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Only initialize an empty demonstration database when explicitly enabled.
hospital.demo.seed-on-start=${DEMO_SEED_ON_START:false}
