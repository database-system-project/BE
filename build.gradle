plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.databasesystem'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.10.0'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    enabled = false
}

['processResources', 'processTestResources'].each { taskName ->
    tasks.named(taskName) {
        exclude '**/application*.yml', '**/application*.yaml'
    }
}

tasks.register('initLocalEnv') {
    group = 'application'
    description = 'Creates an ignored local .env with random PostgreSQL and JWT secrets.'
    doLast {
        def target = file('.env').toPath()
        if (java.nio.file.Files.exists(target)) {
            throw new GradleException('.env already exists; existing values were preserved.')
        }
        def random = new java.security.SecureRandom()
        def randomHex = { int length ->
            byte[] bytes = new byte[length]
            random.nextBytes(bytes)
            bytes.encodeHex().toString()
        }
        def content = file('.env.example').getText('UTF-8')
                .replace('CHANGE_ME_POSTGRES_PASSWORD', randomHex(24))
                .replace('CHANGE_ME_JWT_SECRET', randomHex(32))
        def attributes = []
        if (target.fileSystem.supportedFileAttributeViews().contains('posix')) {
            attributes.add(java.nio.file.attribute.PosixFilePermissions.asFileAttribute(
                    java.nio.file.attribute.PosixFilePermissions.fromString('rw-------')))
        }
        java.nio.file.Files.createFile(target, attributes as java.nio.file.attribute.FileAttribute[])
        java.nio.file.Files.writeString(target, content, java.nio.charset.StandardCharsets.UTF_8)
        logger.lifecycle('Created .env with local-only values. Secret values are not printed.')
    }
}
